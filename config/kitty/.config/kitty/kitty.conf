include theme.conf

# Couleurs generees par quickshell (matugen) depuis le fond d'ecran et le
# schema choisi dans ses reglages. Le fichier est reecrit par
# scripts/colors/applycolor.sh, qui envoie ensuite SIGUSR1 a kitty pour le
# recharger a chaud. Il passe apres theme.conf pour le surcharger :
# commenter cette ligne pour revenir a la palette graphite fixe.
include ${HOME}/.local/state/quickshell/user/generated/terminal/kitty-theme.conf

font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5

window_padding_width 24
hide_window_decorations yes
confirm_os_window_close 0

background_opacity 0.85
dynamic_background_opacity yes

cursor_shape beam
cursor_blink_interval 0

scrollback_lines 10000

enable_audio_bell no
