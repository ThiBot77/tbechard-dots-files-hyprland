# Prompt powerline arrondi, inspiré de github.com/elifouts/Dotfiles.
#
# Index de palette 256, réécrits par quickshell avec les couleurs Material You
# (scripts/colors/terminal/) :
#   255 primary            240 onPrimary
#   254 primaryContainer   233 onPrimaryContainer
#   253 secondary          235 onSecondaryContainer
#   252 secondaryContainer 251 tertiary
#   249 error
#
# Séparateurs : bg = segment précédent, fg = segment suivant.

format = """\
[](fg:255)\
$os\
[](bg:255 fg:254)\
$username\
[](bg:254 fg:252)\
$directory\
[](fg:252)\
$git_branch\
$git_status\
$cmd_duration\
$character"""

add_newline = true

[os]
disabled = false
style = "bg:255 fg:240"
[os.symbols]
Arch = " "
Linux = " "

[username]
show_always = true
format = "[$user ](bg:254 fg:233)"
disabled = false

[directory]
format = "[$path ](bg:252 fg:235)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "\U000f0219 "
"Downloads" = "\uf019 "
"Music" = "\U000f075a "
"Pictures" = "\uf03e "

[git_branch]
symbol = "  "
format = "[$symbol$branch]($style)"
style = "fg:251"

[git_status]
format = "[ $all_status$ahead_behind]($style)"
style = "fg:251"

[cmd_duration]
min_time = 2000
format = "[ $duration]($style)"
style = "fg:253"

[character]
success_symbol = "[❯](bold 255)"
error_symbol = "[❯](bold 249)"
disabled = false
