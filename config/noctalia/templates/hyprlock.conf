# Mise en page reprise de HyDE (Configs/.config/hypr/hyprlock/HyDE.conf),
# ses variables $wallbash_* et $MPRIS_IMAGE traduites en couleurs noctalia et
# en scripts locaux.
$font = JetBrainsMono Nerd Font
$avatar = $HOME/.face.icon
$music = $HOME/.config/hypr/hyprlock-music.sh

general {
    hide_cursor = false
    ignore_empty_input = true
    disable_loading_bar = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 7
    noise = 0.011
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.15
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb({{colors.on_surface.default.hex_stripped}})
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:43200000] date +"%A %-d %B %Y"
    color = rgb({{colors.on_surface_variant.default.hex_stripped}})
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}

image {
    monitor =
    path = $avatar
    size = 150
    rounding = -1
    border_size = 2
    border_color = rgb({{colors.outline.default.hex_stripped}})
    reload_time = 5
    reload_cmd = $music --cover
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] echo "$(H=$(date +%H); if [ $H -lt 12 ]; then echo Bonjour; elif [ $H -lt 18 ]; then echo Bon après-midi; else echo Bonsoir; fi), Thibault"
    color = rgb({{colors.on_surface.default.hex_stripped}})
    font_size = 20
    font_family = $font Bold
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    rounding = -1
    outer_color = rgb({{colors.primary.default.hex_stripped}})
    inner_color = rgb({{colors.surface_container_high.default.hex_stripped}})
    font_color = rgb({{colors.on_surface.default.hex_stripped}})
    check_color = rgb({{colors.tertiary.default.hex_stripped}})
    fail_color = rgb({{colors.error.default.hex_stripped}})
    capslock_color = rgb({{colors.error.default.hex_stripped}})
    swap_font_color = false
    hide_input = false
    fade_on_empty = false
    placeholder_text = <i><span foreground="##{{colors.on_surface_variant.default.hex_stripped}}">Mot de passe</span></i>
    fail_text = <i><span foreground="##{{colors.error.default.hex_stripped}}">$FAIL ($ATTEMPTS)</span></i>
    position = 0, -110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:2000] $music --now
    color = rgb({{colors.on_surface_variant.default.hex_stripped}})
    font_size = 15
    font_family = $font
    position = 0, 45
    halign = center
    valign = bottom
}
