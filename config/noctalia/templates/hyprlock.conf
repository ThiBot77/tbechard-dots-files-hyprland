$font = SF Pro Display
$avatar = $HOME/.face.icon
$name = Thibault
$quotes = $HOME/.config/hypr/quotes.txt

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.011
    contrast = 0.88
    brightness = 0.5
    vibrancy = 0.12
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb({{colors.on_surface.default.hex_stripped}})
    font_size = 76
    font_family = $font
    position = 0, 330
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:43200000] date +"%A %-d %B"
    color = rgb({{colors.on_surface_variant.default.hex_stripped}})
    font_size = 22
    font_family = $font
    position = 0, 250
    halign = center
    valign = center
}

image {
    monitor =
    path = $avatar
    size = 128
    rounding = -1
    border_size = 2
    border_color = rgb({{colors.outline.default.hex_stripped}})
    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = $name
    color = rgb({{colors.on_surface.default.hex_stripped}})
    font_size = 20
    font_family = $font
    position = 0, -35
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    rounding = 12

    outer_color = rgb({{colors.outline.default.hex_stripped}})
    inner_color = rgb({{colors.surface_container.default.hex_stripped}})
    font_color = rgb({{colors.on_surface.default.hex_stripped}})
    check_color = rgb({{colors.primary.default.hex_stripped}})
    fail_color = rgb({{colors.error.default.hex_stripped}})
    capslock_color = rgb({{colors.error.default.hex_stripped}})

    fade_on_empty = false
    placeholder_text = Mot de passe
    fail_text = $FAIL ($ATTEMPTS)

    position = 0, -115
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:30000] shuf -n 1 $quotes
    color = rgb({{colors.outline.default.hex_stripped}})
    font_size = 14
    font_family = $font Italic
    position = 0, 48
    halign = center
    valign = bottom
}

label {
    monitor =
    text = $LAYOUT
    color = rgb({{colors.outline.default.hex_stripped}})
    font_size = 13
    font_family = $font
    position = -28, 22
    halign = right
    valign = bottom
}
