--ozone-platform-hint=wayland
# --gtk-version=4 retire : force GTK4 dans Electron, ce qui cassait le rendu
# des icones dans VS Code. Les defauts d'Electron conviennent.
--ignore-gpu-blocklist
--enable-features=TouchpadOverscrollHistoryNavigation
--enable-wayland-ime
--password-store=gnome-libsecret
