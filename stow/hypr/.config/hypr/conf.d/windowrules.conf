# The cava audio visualizer widget (toggled with SUPER+V, see
# ~/.local/bin/toggle-cava-widget.sh): a borderless floating panel pinned to
# the left edge of the screen, visible on every workspace.
windowrule = float on, match:class ^(cava-widget)$
windowrule = pin on, match:class ^(cava-widget)$
windowrule = border_size 0, match:class ^(cava-widget)$
windowrule = no_shadow on, match:class ^(cava-widget)$
windowrule = no_blur on, match:class ^(cava-widget)$
windowrule = move 0 0, match:class ^(cava-widget)$
windowrule = size 420 100%, match:class ^(cava-widget)$
windowrule = no_initial_focus on, match:class ^(cava-widget)$

# Utility windows that should always float.
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(blueman-manager)$

# Glass/blur effect on the bar, launcher and notifications.
layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace rofi
layerrule = blur on, match:namespace notifications
