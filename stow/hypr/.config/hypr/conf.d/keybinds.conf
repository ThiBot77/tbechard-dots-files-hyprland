$mainMod = SUPER
$terminal = kitty
$launcher = rofi -show drun -theme ~/.config/rofi/launcher.rasi
$fileManager = thunar

bind = $mainMod, T, exec, $terminal
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, R, exec, $launcher
bind = $mainMod, A, exec, $launcher
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, exec, $HOME/.local/bin/toggle-cava-widget.sh
bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, M, exec, wlogout -b 3
bind = $mainMod SHIFT, W, exec, $HOME/.local/bin/wallpaper-menu.sh
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod SHIFT, D, exec, nwg-displays
bind = $mainMod SHIFT, R, exec, $HOME/.local/bin/toggle-recording.sh
bind = $mainMod SHIFT, V, exec, $HOME/.local/bin/clipboard-menu.sh
# Bascule azerty <-> qwerty. switchxkblayout est une commande hyprctl et
# non un dispatcher : en bind direct Hyprland la rejette. "all" pour que
# les claviers secondaires
# (clavier du casque, souris) suivent le principal.
bind = $mainMod, K, exec, hyprctl switchxkblayout all next

# Scratchpad: a floating terminal on Hyprland's "special" workspace, shown
# over whatever is on screen and hidden again with the same key.
bind = $mainMod, S, togglespecialworkspace, scratchpad
bind = $mainMod SHIFT, S, movetoworkspace, special:scratchpad

bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, E, exit
bind = $mainMod, F, fullscreen
bind = $mainMod, SPACE, togglefloating
bind = $mainMod, W, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, J, layoutmsg, togglesplit

# focus
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# workspaces — bound by physical keycode (code:10..19 = the top-row number
# keys), not by keysym, because on azerty those keys type &é"'(-è_çà
# unshifted: keysym binds like `bind = $mainMod, 1, ...` would need SHIFT too.
bind = $mainMod, code:10, workspace, 1
bind = $mainMod, code:11, workspace, 2
bind = $mainMod, code:12, workspace, 3
bind = $mainMod, code:13, workspace, 4
bind = $mainMod, code:14, workspace, 5
bind = $mainMod, code:15, workspace, 6
bind = $mainMod, code:16, workspace, 7
bind = $mainMod, code:17, workspace, 8
bind = $mainMod, code:18, workspace, 9
bind = $mainMod, code:19, workspace, 10

bind = $mainMod SHIFT, code:10, movetoworkspace, 1
bind = $mainMod SHIFT, code:11, movetoworkspace, 2
bind = $mainMod SHIFT, code:12, movetoworkspace, 3
bind = $mainMod SHIFT, code:13, movetoworkspace, 4
bind = $mainMod SHIFT, code:14, movetoworkspace, 5
bind = $mainMod SHIFT, code:15, movetoworkspace, 6
bind = $mainMod SHIFT, code:16, movetoworkspace, 7
bind = $mainMod SHIFT, code:17, movetoworkspace, 8
bind = $mainMod SHIFT, code:18, movetoworkspace, 9
bind = $mainMod SHIFT, code:19, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# screenshot: region opens swappy to annotate/save/copy, SHIFT = instant full screen to clipboard
bind = , PRINT, exec, hyprshot -m region --raw -s -z | swappy -f -
bind = SHIFT, PRINT, exec, hyprshot -m output --clipboard-only -s
bind = $mainMod, PRINT, exec, hyprshot -m window --raw -s | swappy -f -

# media / volume / brightness
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
