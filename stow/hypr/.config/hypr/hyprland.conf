# Main entrypoint — see conf.d/ for keybinds, monitors, window rules, env, animations.

source = ~/.config/hypr/conf.d/monitors.conf
source = ~/.config/hypr/conf.d/env.conf
source = ~/.config/hypr/conf.d/keybinds.conf
source = ~/.config/hypr/conf.d/windowrules.conf
source = ~/.config/hypr/conf.d/animations.conf
source = ~/.config/hypr/colors.conf

general {
    gaps_in = 4
    gaps_out = 10
    border_size = 2
    col.active_border = $accent $accent_dim 45deg
    col.inactive_border = $border_inactive
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 14

    active_opacity = 0.95
    inactive_opacity = 0.85

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000099)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
    }
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

gestures {
    workspace_swipe_touch = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x000000
}

input {
    kb_layout = fr
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}
