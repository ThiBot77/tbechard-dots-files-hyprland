source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
}

# The blurred desktop is darkened here rather than with a scrim shape on top:
# background is the only widget that sits below everything by default, so
# dimming it avoids any z-order juggling with the content.
background {
    path = screenshot
    color = $bg
    blur_passes = 3
    blur_size = 9
    brightness = 0.32
    contrast = 0.85
    vibrancy = 0.05
    noise = 0.008
}

# --- clock -----------------------------------------------------------------
# Weight 200 (ExtraLight) via pango markup: Adwaita Sans is a variable font and
# hyprlock renders pango, but "Adwaita Sans Light" as a *family* does not
# resolve (fontconfig falls back to Nimbus Sans) — the weight has to be a span.
label {
    text = cmd[update:1000] date +'<span weight="200">%H:%M</span>'
    color = $fg
    font_size = 132
    font_family = Adwaita Sans
    position = 0, 215
    halign = center
    valign = center
}

# sed '\U&' rather than tr: tr mangles accented characters (AOûT).
label {
    text = cmd[update:60000] printf '<span letter_spacing="3400">%s</span>' "$(date '+%A %d %B' | sed 's/.*/\U&/')"
    color = $fg_dim
    font_size = 15
    font_family = Adwaita Sans
    position = 0, 112
    halign = center
    valign = center
}

# --- identity + auth -------------------------------------------------------
image {
    path = ~/.config/hypr/avatar.png
    size = 146
    rounding = -1
    border_size = 2
    border_color = $accent
    position = 0, -50
    halign = center
    valign = center
}

# Hardcoded: this account has no GECOS name (getent passwd returns an empty
# name field), so there is nothing to read it from — change it here.
label {
    text = <span weight="500">Thibault Bechard</span>
    color = $fg
    font_size = 19
    font_family = Adwaita Sans
    position = 0, -163
    halign = center
    valign = center
}

input-field {
    size = 330, 54
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    rounding = 27
    outer_color = $accent
    inner_color = $bg_alt_a
    font_color = $fg
    check_color = $accent
    fail_color = $accent_dim
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fade_on_empty = false
    placeholder_text = <i>Mot de passe</i>
    position = 0, -240
    halign = center
    valign = center
}

# --- bottom bar ------------------------------------------------------------
image {
    path = ~/.cache/hypr-mpris-blank.png
    reload_cmd = ~/.local/bin/mpris-cover.sh
    reload_time = 3
    size = 52
    rounding = 12
    border_size = 0
    position = 64, 80
    halign = left
    valign = bottom
}

label {
    text = cmd[update:2000] playerctl status >/dev/null 2>&1 && playerctl metadata title | cut -c1-34
    color = $fg
    font_size = 14
    font_family = Adwaita Sans
    position = 132, 92
    halign = left
    valign = bottom
}

label {
    text = cmd[update:2000] playerctl status >/dev/null 2>&1 && playerctl metadata artist | cut -c1-34
    color = $fg_dim
    font_size = 12
    font_family = Adwaita Sans
    position = 132, 70
    halign = left
    valign = bottom
}

label {
    text = cmd[update:3600000] printf '<i>%s</i>' "$(shuf -n1 ~/.config/hypr/dev-quotes.txt)"
    color = $fg_faint
    font_size = 12
    font_family = Adwaita Sans
    position = 0, 78
    halign = center
    valign = bottom
}

label {
    text = <span letter_spacing="2200">$LAYOUT</span>
    color = $fg_dim
    font_size = 13
    font_family = Adwaita Sans
    position = -64, 80
    halign = right
    valign = bottom
}
