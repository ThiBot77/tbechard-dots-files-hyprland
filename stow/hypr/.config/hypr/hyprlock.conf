source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
}

background {
    path = screenshot
    color = $bg
    blur_passes = 3
    blur_size = 9
    brightness = 0.32
    contrast = 0.85
    vibrancy = 0.05
    noise = 0.008
}

# --- heure empilee ----------------------------------------------------------
# Positions en pourcentage : les trois ecrans n'ont pas la meme hauteur
# (1440p et 1080p), des pixels fixes decaleraient la composition sur l'un.
label {
    text = cmd[update:1000] date +%H
    color = $accent
    font_size = 190
    font_family = Adwaita Sans
    position = 0, 28%
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] date +%M
    color = $accent
    font_size = 190
    font_family = Adwaita Sans
    position = 0, 15%
    halign = center
    valign = center
}

# --- jour / date ------------------------------------------------------------
label {
    text = cmd[update:60000] date +%A
    color = $fg
    font_size = 26
    font_family = FiraCode Nerd Font
    position = 0, 4.6%
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date '+%d %b'
    color = $fg_dim
    font_size = 20
    font_family = FiraCode Nerd Font
    position = 0, 2%
    halign = center
    valign = center
}

# --- ressenti ---------------------------------------------------------------
# wttrbar fait deja l'appel reseau et la mise en cache ; timeout pour que le
# label ne bloque jamais l'affichage du verrou, et rien ne s'affiche si la
# requete echoue plutot qu'un "Ressenti °C" tronque.
label {
    text = cmd[update:900000] t=$(timeout 6 wttrbar --lang fr --custom-indicator '{FeelsLikeC}' 2>/dev/null | jq -r '.text // empty'); [ -n "$t" ] && printf 'Ressenti <b>%s°C</b>' "$t"
    color = $fg_dim
    font_size = 19
    font_family = FiraCode Nerd Font
    position = 0, 8%
    halign = center
    valign = bottom
}

# --- disposition clavier ----------------------------------------------------
label {
    text = $LAYOUT
    color = $fg_dim
    font_size = 13
    font_family = FiraCode Nerd Font
    position = -40, 34
    halign = right
    valign = bottom
}

# --- saisie -----------------------------------------------------------------
# fade_on_empty : le champ reste invisible tant qu'on n'a pas tape, la frappe
# arrive dessus de toute facon sans avoir a le viser.
input-field {
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    rounding = 25
    outer_color = $accent
    inner_color = $bg_alt_a
    font_color = $fg
    check_color = $accent
    fail_color = $accent_dim
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fade_on_empty = true
    fade_timeout = 2500
    placeholder_text =
    position = 0, -8%
    halign = center
    valign = center
}
