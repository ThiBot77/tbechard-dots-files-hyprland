background {
    path = screenshot
    color = rgba(00000099)
    blur_passes = 3
    blur_size = 8
}

image {
    path = ~/.config/hypr/avatar.png
    size = 220
    rounding = -1
    border_size = 3
    border_color = rgba(ffffffee)
    position = 0, 310
    halign = center
    valign = center
}

input-field {
    size = 260, 60
    outline_thickness = 2
    dots_size = 0.25
    outer_color = rgba(808080ee)
    inner_color = rgba(00000099)
    font_color = rgba(ffffffff)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff99">Password...</span>
    position = 0, -60
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(ffffffff)
    font_size = 64
    font_family = FiraCode Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] echo "$(date +'%A %d %B')"
    color = rgba(ffffffaa)
    font_size = 16
    font_family = FiraCode Nerd Font
    position = 0, 30
    halign = center
    valign = center
}

label {
    text = cmd[update:999999999] shuf -n1 ~/.config/hypr/dev-quotes.txt
    color = rgba(ffffff88)
    font_size = 13
    font_family = FiraCode Nerd Font
    position = 0, -160
    halign = center
    valign = center
}
