[General]
# Kept in sync by hand with themes/graphite/palette.sh — the greeter runs
# before any user session, so theme-switch.sh (a user script) can't reach it.
background=#0a0a0b
surface=#141417
foreground=#d6d6d8
foregroundDim=#6b6b70
accent=#b9b9be
border=#1c1c1f

font=Adwaita Sans
iconFont=FiraCode Nerd Font

# This account has no GECOS name (getent passwd returns an empty name field),
# so userModel.realName is blank — the display name lives here instead.
fullName=Thibault Bechard

# Paths are relative to this theme directory. Regenerate them with the
# commands documented in README.md if you change wallpaper or avatar.
backgroundImage=assets/background.jpg
avatarImage=assets/avatar.png
