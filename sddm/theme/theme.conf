[General]

## [Background]

BackgroundS="backgrounds/graphite.jpg"
## Path relative to the theme root. This fork of the theme reads BackgroundS,
## not Background, and picks one entry at random from the space-separated list
## on every boot. A single entry keeps the greeter deterministic.

ScreenWidth="1920"
ScreenHeight="1080"
## Resolution of the panel the greeter comes up on, and the size the
## background must be. The theme scales its whole layout off these two, so a
## background of any other size shrinks the form and the clock with it. Both
## are mandatory: with ScreenWidth unset the theme falls back to
## Screen.ScreenWidth, which does not exist, and the root item gets no width.
## Regenerate the background with the command in README.md after changing them.

ScaleImageCropped="true"
DimBackgroundImage="0.0"
## The background is already dark (it is the rice wallpaper, desaturated), so
## it needs no darkening overlay of its own.

BackgroundImageHAlignment="center"
BackgroundImageVAlignment="center"

## [Blur]

FullBlur="false"
PartialBlur="true"
BlurRadius="30"
## Only the form side is blurred: the wallpaper shapes stay readable on the
## rest of the screen.

## [Colors]
##
## Duplicated from the rice palette on purpose: the greeter runs before any
## user session, so it cannot read anything under $HOME. The names in comments
## are the kitty palette slots in config/kitty/.config/kitty/theme.conf.

MainColor="#d6d6d8"
## foreground / color7. Text and controls at rest.

AccentColor="#f0f0f2"
## color15, the brightest slot. Graphite has no hue to accent with, so focus
## and hover read as a step up in brightness from MainColor rather than a
## colour change. Anything dimmer than this is indistinguishable from
## MainColor on the form background.

BackgroundColor="#141417"
## surface / color0. Form background and the user and session selectors.
## Blends with the blur, since PartialBlur and HaveFormBackground are both on.

OverrideLoginButtonTextColor="#0a0a0b"
## The button is filled with AccentColor, so its label takes the palette
## background. Left to itself the theme would pick a washed out #444 here.

## [Layout]

HaveFormBackground="true"
FormPosition="left"
RoundCorners="20"
ScreenPadding="0"
InterfaceShadowSize="6"
InterfaceShadowOpacity="0.6"

Font="Space Grotesk"
FontSize=""
## Installed system-wide by otf-space-grotesk in packages/aur.txt, so it is
## there for the greeter, which runs as root and cannot see user fonts. It is
## also the rice's own "expressive" face, see quickshell Config.qml.

## [Behavior]

ForceLastUser="true"
ForcePasswordFocus="true"
## Paired with RememberLastUser in sddm/conf.d/10-tbe.conf: the username is
## prefilled and the cursor lands in the password field.

ForceRightToLeft="false"
ForceHideCompletePassword="false"
ForceHideVirtualKeyboardButton="false"
ForceHideSystemButtons="false"
AllowEmptyPassword="false"
AllowBadUsernames="false"

## [Locale]

Locale="fr_FR"
## The greeter runs as root with no user locale, so without this the clock
## and the date come out in English.
HourFormat="HH:mm"
DateFormat="dddd d MMMM"
## 24 hour clock and a French-style date, both taken from the system locale.

