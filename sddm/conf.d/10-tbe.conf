# Installed to /etc/sddm.conf.d/ by scripts/40-sddm.sh
# Left on SDDM's default X11 greeter backend on purpose: the Wayland backend
# needs a compositor for the greeter (kwin_wayland or weston), which would
# pull in a desktop we don't otherwise use.
[Theme]
Current=tbe

[Users]
# Prefills the username field and preselects the session on the next login.
# Only takes effect after one successful login *through SDDM* — the value is
# written by SDDM itself, so it stays empty while GDM is the display manager.
RememberLastUser=true
RememberLastSession=true
