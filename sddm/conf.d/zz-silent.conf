# Named zz- so it sorts after /usr/lib/sddm/sddm.conf.d/default.conf,
# which sets an empty Current= that would otherwise win.
[Theme]
Current=silent

[General]
# The theme's QML lives under components/, and InputMethod alone does not
# export QT_IM_MODULE, so the greeter needs both spelled out here.
InputMethod=qtvirtualkeyboard
GreeterEnvironment=QML2_IMPORT_PATH=/usr/share/sddm/themes/silent/components/,QT_IM_MODULE=qtvirtualkeyboard

[Users]
RememberLastUser=true
RememberLastSession=true
